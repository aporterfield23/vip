name: Build design tokens
on:
  push:
    paths: ['tokens/**', 'sd.config.mjs', 'ios-system-map.json', 'package.json', '.github/workflows/tokens.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run tokens
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild design tokens'
          file_pattern: 'ios web/src'

  # Compiles what the build just committed, with Apple's own tools, so a
  # developer never receives Swift or an asset catalog that does not build.
  check-ios:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Type-check the generated Swift
        run: |
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios17.0-simulator \
            ios/DesignSystem/*.swift
      - name: Compile the asset catalog
        run: |
          set -o pipefail
          mkdir -p build
          xcrun actool ios/Assets.xcassets --compile build \
            --platform iphonesimulator --minimum-deployment-target 17.0 \
            --target-device iphone --accent-color AccentColor \
            --output-partial-info-plist build/partial.plist \
            --errors --warnings --output-format human-readable-text | tee build/actool.txt
          test -f build/Assets.car
          if grep -qi 'error' build/actool.txt; then echo "actool reported errors"; exit 1; fi
          grep -q AccentColor build/partial.plist
          echo "Swift and asset catalog compile."
