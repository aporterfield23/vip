<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VIP Photographer App – Demo</title>
  <!-- tokens are generated from tokens/tokens.json by `npm run tokens`; do not edit these two files by hand -->
  <link rel="stylesheet" href="src/fonts.css">
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/tokens-dark.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="controls" role="group" aria-label="Demo controls">
    <select id="jump" aria-label="Jump to a screen"><option value="">Jump to…</option><option value="auth">Sign in &amp; Register</option><option value="schedule">Schedule</option><option value="today">Assignment (today, start the journey)</option><option value="lead">Assignment (Sports, lead, QR)</option><option value="past">Schedule · Past 5 days</option><option value="timeoff">Time Off</option><option value="timesheets">Timesheets</option><option value="account">Account</option><option value="notif">Notifications</option></select>
    <button id="restart">Restart</button>
    <button id="light" data-mode="light" aria-pressed="true">Light</button>
    <button id="dark" data-mode="dark" aria-pressed="false">Dark</button>
  </div>
  <button id="full" class="cta" aria-pressed="false">⤢ View full screen</button>
  <main class="phone" id="phone" data-mode="light" aria-label="VIP Photographer App demo"></main>
  <p class="hint">Functional demo of the VIP Photographer App design. Invite code: VIP-4829-KQ. Any 6-digit code works. All names, rates and amounts are placeholders.</p>
  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="screens-auth.js"></script>
  <script src="screens-main.js"></script>
  <script src="screens-more.js"></script>
  <script src="overlays.js"></script>
  <script src="app.js"></script>
</body>
</html>
